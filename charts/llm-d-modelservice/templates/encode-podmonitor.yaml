{{- if and .Values.encode.create .Values.encode.monitoring.podmonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "llm-d-modelservice.encodeName" . }}-podmonitor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-d-modelservice.labels" . | nindent 4 }}
    app.kubernetes.io/component: encode
  {{- with .Values.encode.monitoring.podmonitor.labels }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.encode.monitoring.podmonitor.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "llm-d-modelservice.encodelabels" . | nindent 6 }}
  podMetricsEndpoints:
  - port: {{ .Values.encode.monitoring.podmonitor.portName | default "metrics" | quote }}
    path: {{ .Values.encode.monitoring.podmonitor.path | default "/metrics" }}
    interval: {{ .Values.encode.monitoring.podmonitor.interval | default "30s" }}
    {{- with .Values.encode.monitoring.podmonitor.scrapeTimeout }}
    scrapeTimeout: {{ . }}
    {{- end }}
    {{- with .Values.encode.monitoring.podmonitor.relabelings }}
    relabelings:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.encode.monitoring.podmonitor.metricRelabelings }}
    metricRelabelings:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- with .Values.encode.monitoring.podmonitor.namespaceSelector }}
  namespaceSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
